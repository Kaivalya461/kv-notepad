<div class="editor">
  <textarea #noteTextArea
            [(ngModel)]="noteText"
            (keydown)="onKeyDown($event)"
            (ngModelChange)="onTextChange($event)"
            placeholder="Start typing..."
            class="editor-textarea"></textarea>

  <!-- Desktop-only counter/warning -->
  <div class="desktop-counter" *ngIf="!isMobile">
    <div class="char-counter" [class.limit-reached]="noteText.length >= maxChars">
      {{ noteText.length }} / {{ maxChars }}
    </div>
    <div *ngIf="noteText.length >= maxChars" class="limit-warning">
      Character limit reached.
    </div>
  </div>
</div>

<!-- Mobile footer -->
<div class="mobile-footer" *ngIf="isMobile">
  <div class="char-counter" [class.limit-reached]="noteText.length >= maxChars">
    {{ noteText.length }} / {{ maxChars }}
  </div>
  <div *ngIf="noteText.length >= maxChars" class="limit-warning">
    Character limit reached.
  </div>
</div>
