<!-- notepad.component.html -->
<div class="container" [class.dark-mode]="isDarkMode">

  <!-- Toolbar as header (mobile only) -->
  <mat-toolbar *ngIf="isMobile" class="app-header">
    <button mat-icon-button (click)="drawer.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="toolbar-title">{{ activeFile || 'KV Notepad' }}</span>
    <span class="spacer"></span>
    <app-action-buttons
      [isDarkMode]="isDarkMode"
      (openAuthDialogOut)="openAuthDialog()">
    </app-action-buttons>
  </mat-toolbar>

  <!-- Sidenav container sits below header -->
  <mat-sidenav-container class="main-container">
    <mat-sidenav #drawer [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile">
      <app-file-list
        [isDarkMode]="isDarkMode"
        [files]="activeNotes"
        [activeFile]="activeFile"
        (selectFile)="updateActiveFile($event)"
        (newFile)="handleNewFile()"
        (deleteFile)="handleDeleteFile($event)">
      </app-file-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <app-editor
        [noteText]="noteText"
        [updatedAt]="activeNoteUpdatedAt"
        (noteChange)="handleNoteChange($event)">
      </app-editor>
      <app-history-viewer></app-history-viewer>
    </mat-sidenav-content>
  </mat-sidenav-container>

  <!-- Desktop-only controls -->
  <div class="desktop-controls" *ngIf="!isMobile">
    <!-- Action Button -> Sun/Moon toggle bottom-right -->
    <app-action-buttons
      [isDarkMode]="isDarkMode"
      (openAuthDialogOut)="openAuthDialog()">
    </app-action-buttons>
  </div>

  <app-auth
    [isDarkMode]="isDarkMode"
    (logoutEvent)="handleLogout()">
  </app-auth>
</div>
