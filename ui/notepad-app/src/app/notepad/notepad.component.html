<!-- notepad.component.html -->
<div class="container" [class.dark-mode]="isDarkMode">
  <app-file-list
    [files]="files"
    [activeFile]="activeFile"
    (selectFile)="handleSelectFile($event)"
    (newFile)="handleNewFile()"
    (deleteFile)="handleDeleteFile($event)">
  </app-file-list>

  <app-editor
    [noteText]="noteText"
    (noteChange)="handleNoteChange($event)">
  </app-editor>

  <!-- Sun/Moon toggle bottom-right -->
  <div class="darkmode-toggle">
    <label class="switch" title="Toggle Dark/Light Mode">
      <input type="checkbox" [(ngModel)]="isDarkMode">
      <span class="slider">
        <span class="icon">{{ isDarkMode ? '🌙' : '🌞' }}</span>
      </span>
    </label>

    <!-- Cloud button -->
    <button class="cloud-btn"
            (click)="openAuthDialog()"
            [title]="!isOnline ? 'Offline - saving locally'
                     : user ? 'Cloud Sync Active' : 'Cloud Sync Disabled'">
      <mat-icon *ngIf="!isOnline">cloud_off</mat-icon>
      <mat-icon *ngIf="isOnline && user">cloud_done</mat-icon>
      <mat-icon *ngIf="isOnline && !user">cloud_queue</mat-icon>
    </button>
  </div>

  <app-auth
    [isDarkMode]="isDarkMode"
    (logoutEvent)="handleLogout()">
  </app-auth>
</div>
