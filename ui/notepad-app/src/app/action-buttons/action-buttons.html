<!-- action-buttons.component.html -->
<div class="action-buttons" [class.dark-mode]="isDarkMode">
  <label class="switch" title="Toggle Dark/Light Mode">
    <input type="checkbox" [checked]="isDarkMode" (change)="toggleDarkMode()">
    <span class="slider">
      <span class="icon">{{ isDarkMode ? '🌙' : '☀️' }}</span>
    </span>
  </label>

  <button class="cloud-btn"
          [class.shine]="isShining"
          (click)="openAuthDialogEvent()"
          [title]="!isOnline ? 'Offline - saving locally'
                   : user ? 'Cloud Sync Active' : 'Cloud Sync Disabled'">
    <mat-icon *ngIf="!isOnline">cloud_off</mat-icon>
    <mat-icon *ngIf="isOnline && user">cloud_done</mat-icon>
    <mat-icon *ngIf="isOnline && !user">cloud_queue</mat-icon>
  </button>
</div>
